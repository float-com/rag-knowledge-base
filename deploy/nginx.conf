# RAG KB 站点 Nginx 配置（宝塔面板）
#
# 【三件事】
#   ① /api/  → 转发到后端 uvicorn（含 SSE 流式问答所需的关闭缓冲）
#   ② /mcp   → 转发到同一个后端（MCP Streamable HTTP，供 Cursor / Inspector 等外部 Agent）
#   ③ 其余    → 回落到前端静态文件（React SPA 的 history 路由）
#
# 【用法】deploy.sh 会自动拷到 /etc/nginx/conf.d/rag-kb.conf；
#         或用宝塔面板"网站 → 设置 → 配置文件"把本文件内容粘进去。
#
# ⚠️ 【部署时必改两处】
#   1) server_name：改成你的域名或服务器公网 IP
#   2) root 路径：若你的站点目录不是 /www/wwwroot/rag-kb/frontend/dist，改成实际路径
#   3) 日志路径：宝塔默认便是 /www/wwwlogs/，若不同请调整，并确保目录存在（nginx 不会自动创建）

# ── 把 http 跳转到 https 的配置（有域名与证书时再启用，否则会 502/重定向循环）──
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # ★ 改成你的域名 / 公网 IP
    server_name 81.70.119.33;

    root /www/wwwroot/rag-kb/frontend/dist;
    index index.html;

    # 上传文件上限：必须比 UPLOAD_MAX_SIZE_MB（默认 50）大 ——
    # 前端上传会带 multipart 头，13MB 是给这个额外开销留的余量。
    # ⚠️ 注意：预签名直传链路【不经 Nginx】（浏览器直接 PUT 到腾讯云 COS），
    #    所以这一项只影响走 /api/documents 的旧链路；但两处都设大没坏处。
    client_max_body_size 64m;

    access_log /www/wwwlogs/rag-kb.log;
    error_log  /www/wwwlogs/rag-kb.error.log;

    # ─────────────────────────────────────────────────────────────
    # ① 后端 API（含 SSE 流式问答）
    # ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE 必需的组合：
        #   proxy_buffering off  —— 不缓冲响应，否则 token 会被攒起来最后一次性吐出，
        #                           前端看到的"逐字输出"就没了
        #   proxy_cache off      —— 不缓存流式响应
        #   chunked_transfer_encoding on —— 允许分块传输，这是流式的载体
        #   read_timeout 600s    —— RAG 整条链路（检索+重排+生成）可能十几秒到几分钟，
        #                           默认 60s 会被 Nginx 提前掐断
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ─────────────────────────────────────────────────────────────
    # ② MCP Streamable HTTP（第 13 期）
    # ─────────────────────────────────────────────────────────────
    # 路径说明：第 13 期用 app.mount("/mcp", ...) 挂在【应用根】上，
    # 不在 /api 下 —— 所以这里必须单独一个 location，且不能写成 /api/mcp。
    #
    # ⚠️ 与上面 /api 段的差异（教程截图里 /mcp 段少了 chunked 那行）：
    # 这里补上了 chunked_transfer_encoding on —— MCP 的流式响应同样可能用分块编码。
    # 补上不会有副作用，建议保持一致。
    location /mcp {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # MCP 客户端可能维持较长的连接（尤其是 Inspector 的调试会话）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ─────────────────────────────────────────────────────────────
    # ③ 前端静态文件（React SPA）
    # ─────────────────────────────────────────────────────────────
    # try_files 的作用：先找真实文件 → 找不到就交给 index.html，
    # 由前端路由（React Router）自己解析路径。
    # 没有这一条，用户直接访问 /documents 或在详情页刷新，会得到 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
