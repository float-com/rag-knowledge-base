# 生产环境 docker-compose override：仅在服务器上使用
#
# 【作用】把 pg / redis 的端口从"绑所有网卡"收回到"只绑回环"，外网无法直连数据库。
#
# 【用法】与主 compose 同目录放置后，直接 `docker compose up -d --build`：
#     cd /www/wwwroot/rag-kb
#     ln -s deploy/docker-compose.override.yml docker-compose.override.yml   # 已由 deploy.sh 自动完成
#
# ⚠️ 根目录那个软链接【已被 .gitignore 忽略】，不要提交它 —— 否则别人 clone 后
#    本地开发会莫名其妙套用生产端口（55432/56379），而本地 .env 是 5432/6379。
#
# =============================================================================
# ★ 为什么必须写 !override（这一条是整个部署里最容易出事的地方）
# =============================================================================
# 主 compose 里写的是：
#     ports:
#       - "${POSTGRES_PORT:-5432}:5432"      ← 不写 IP = 绑定 0.0.0.0 = 公网可达
#
# 而 compose 合并多个文件时，`ports` 这类【列表】默认是【追加】而不是替换。
# 于是只写 `ports: ["127.0.0.1:55432:5432"]` 会变成"绑两次"：
#     0.0.0.0:55432 -> 5432     ← 仍然对公网开放！（数据库裸奔）
#     127.0.0.1:55432 -> 5432
#
# 加上 `!override` 标签表示【整段替换】，才能把绑 0.0.0.0 的那条去掉。
# 该标签要求 Docker Compose v2.24+（`docker compose version` 可查）。
#
# ⚠️ 部署后必须验证（deploy.sh 会自动查）：
#     docker compose ps --format "table {{.Name}}\t{{.Ports}}"
#   期望看到：127.0.0.1:55432->5432/tcp
#   若看到 0.0.0.0:55432->5432/tcp，说明 !override 没生效 —— 立刻停容器排查版本。
#
# 【为什么端口选 55432 / 56379 而不是 5432 / 6379】
# 避免与服务器上可能已有的 PostgreSQL / Redis 实例冲突。
# 本项目第 12 期就踩过"Windows 原生 Redis 抢占 6379 导致语义缓存不可用"，
# 换个端口是最省事的规避方式。

services:
  postgres:
    ports: !override
      - "127.0.0.1:55432:5432"

  redis:
    ports: !override
      - "127.0.0.1:56379:6379"
